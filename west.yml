manifest:
  version: 1.0

  projects:
    - name: zephyr
      url: https://github.com/zephyrproject-rtos/zephyr
      revision: v4.2.0
      import:
        name-allowlist:
          - cmsis_6
          - hal_nxp
          - hal_stm32
          - hal_nordic
        path-prefix: deps

    - name: nn-custom-driver
      path: deps/modules/lib/nn-custom-driver
      revision: main
      url: https://github.com/ted-havelka-portfolio/nn-custom-driver
